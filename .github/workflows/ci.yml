name: ci

on:
  pull_request:
  push:
    branches: [main, stage]

jobs:
  lint-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src app tests scripts analysis
      # La interfaz no tiene paso de build, asi que su unica red de seguridad de
      # sintaxis es esta: node viene ya en los runners.
      - run: node --check static/app.js
      - run: pytest -q

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Solo comprueba que la imagen se construye. No se publica en ningun registro:
      # el despliegue construye en la propia instancia.
      - run: docker build -t aivoicerecognition:ci .
      - run: docker build -f Dockerfile.worker -t aivoicerecognition-worker:ci .

      # El Caddyfile se valida aparte porque un error suyo no rompe el build de la imagen:
      # se descubrio con caddy en bucle de reinicio, no en CI. DOMINIO se pasa con el mismo
      # valor por defecto que pone docker-compose.yml.
      - name: Caddyfile valido
        run: |
          docker run --rm -e DOMINIO=:80 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e DOMINIO=detect.ejemplo.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
