name: ci

on:
  pull_request:
  push:
    branches: [main, stage]

jobs:
  lint-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts analysis
      - run: pytest -q

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Solo comprueba que la imagen se construye. No se publica en ningun registro:
      # el despliegue construye en la propia instancia.
      - run: docker build -t aivoicerecognition:ci .
