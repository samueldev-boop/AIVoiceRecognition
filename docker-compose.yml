services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: altur-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: altur-worker
    volumes:
      - ./data:/srv/data
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped
