# Solo configuracion de herramientas. Las dependencias viven en requirements.txt,
# que es lo que consume el Dockerfile.

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sin esto, "pytest" a secas no encuentra el paquete app: solo "python -m pytest"
# anade el directorio actual a sys.path.
pythonpath = ["."]
markers = ["integration: requires an explicitly configured disposable MongoDB server"]
